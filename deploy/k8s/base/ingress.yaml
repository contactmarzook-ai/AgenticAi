apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentos
  annotations:
    # ingress-nginx: agent runs can take minutes; webhook bodies are small.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: agentos.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: agentos-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: agentos-web, port: { name: http } }
