apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: agentos
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - api.yaml
  - scheduler.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicy.yaml


# Images are referenced as "agentos-api" / "agentos-web"; overlays map them to your registry and tag.
