apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos-api
  labels: &labels
    app.kubernetes.io/name: agentos-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: *labels
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: agentos
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      initContainers:
        # Applies database migrations. Safe with many replicas: Alembic takes a Postgres advisory lock.
        - name: migrate
          image: agentos-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: agentos-config }
            - secretRef: { name: agentos-secrets }
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: api
          image: agentos-api
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: agentos-config }
            - secretRef: { name: agentos-secrets }
          securityContext: *container-security
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Give the ingress time to stop sending traffic before shutdown starts.
            preStop:
              exec: { command: ["sleep", "10"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agentos-api
  labels:
    app.kubernetes.io/name: agentos-api
spec:
  selector:
    app.kubernetes.io/name: agentos-api
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentos-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agentos-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentos-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos-api
