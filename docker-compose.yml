# Single-machine deployment: PostgreSQL + Ollama + AgentOS (API, scheduler, web).
#   cp .env.example .env   # then edit the secrets
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct
#   open http://localhost:8080
name: agentos

x-api-env: &api-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://agentos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/agentos
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  CREDENTIALS_KEY: ${CREDENTIALS_KEY:?set CREDENTIALS_KEY in .env}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
  LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-qwen2.5:7b-instruct}
  HTTP_TOOL_ALLOWED_HOSTS: ${HTTP_TOOL_ALLOWED_HOSTS:-}
  CORS_ORIGINS: ""
  AUTO_CREATE_TABLES: "false"
  LOG_JSON: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentos
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.7
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # Uncomment to use an NVIDIA GPU (requires the NVIDIA container toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      retries: 6
    restart: unless-stopped

  scheduler:
    build: ./backend
    command: ["python", "-m", "app.scheduler"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
